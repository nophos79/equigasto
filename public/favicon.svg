<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="30%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="lemonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Soft Lemon pastel squircle card -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#lemonBg)" stroke="#facc15" stroke-width="4"/>

  <g filter="url(#softGlow)" fill="none" stroke="url(#auroraGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <!-- Euro main arc (C-curve) -->
    <path d="M 330 185 A 120 120 0 1 0 330 327" />

    <!-- Top bar with arrow pointing right -->
    <path d="M 160 226 L 315 226" />
    <path d="M 285 196 L 318 226 L 285 256" />

    <!-- Bottom bar with arrow pointing left -->
    <path d="M 310 286 L 155 286" />
    <path d="M 185 256 L 152 286 L 185 316" />
  </g>
</svg>
